<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calckori - Kalkulator Ilmiah Pink</title>
<style>
:root{--pink:#ffb6c9;--pink-soft:#ffe4ec;--pink-dark:#ff7fa2;--pink-card:#fff0f5;--text:#6b2a3d}
*{box-sizing:border-box;font-family:'Poppins',system-ui,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ffeaf0,#ffd6e7,#ffc2d6);display:flex;justify-content:center;align-items:center;padding:16px}
.calc{width:100%;max-width:420px;background:var(--pink-card);border-radius:32px;padding:22px;box-shadow:0 20px 40px rgba(255,127,162,.25), inset 0 0 0 2px #fff;border:2px solid #ffcfe0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.header h1{margin:0;font-size:20px;color:var(--text)} .header span{font-size:12px;color:#b76b84}
.display{background:#fff;border:2px solid #ffd0dd;border-radius:20px;padding:14px 16px;min-height:90px;box-shadow:inset 0 2px 8px rgba(0,0,0,.04)}
#expr{font-size:15px;color:#8a5a6b;min-height:20px;word-break:break-all;text-align:right}
#result{font-size:34px;font-weight:800;color:#d94a76;text-align:right;margin-top:4px}
.mode{font-size:11px;color:#c27d94;margin-top:6px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
button{border:none;border-radius:16px;padding:14px 0;font-size:16px;font-weight:600;cursor:pointer;transition:.15s;background:#ffd9e6;color:#7a3650;box-shadow:0 4px 0 #ffb3c9,0 6px 12px rgba(0,0,0,.06)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #ffb3c9}
.btn-op{background:#ffb6c9;color:#fff}
.btn-fn{background:#ffe4ec;font-size:14px}
.btn-num{background:#fff0f6}
.btn-del{background:#fff;color:#d46a8a}
/* KUCING = */
.cat-btn{grid-column:span 1;grid-row:span 2;background:#ff8fab;border-radius:22px;position:relative;color:white;font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 6px 0 #ff5c8a}
.cat-btn::before{content:'🐱';font-size:34px}
.cat-btn::after{content:'=';font-size:22px;font-weight:900;margin-top:2px}
.cat-btn:active{box-shadow:0 2px 0 #ff5c8a}
.small{font-size:11px;color:#b06a82;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="calc">
  <div class="header"><h1>🐾 Calckori</h1><span>DEG • SCI</span></div>
  <div class="display">
    <div id="expr">0</div>
    <div id="result">0</div>
    <div class="mode" id="mode">Mode: DEG | Tap CAT untuk =</div>
  </div>
  <div class="grid">
    <button class="btn-fn" onclick="toggleAngle()">DEG</button>
    <button class="btn-fn" onclick="insert('(')">(</button>
    <button class="btn-fn" onclick="insert(')')">)</button>
    <button class="btn-fn" onclick="clearAll()">AC</button>
    <button class="btn-del" onclick="del()">⌫</button>

    <button class="btn-fn" onclick="insert('sin(')">sin</button>
    <button class="btn-fn" onclick="insert('cos(')">cos</button>
    <button class="btn-fn" onclick="insert('tan(')">tan</button>
    <button class="btn-fn" onclick="insert('log(')">log</button>
    <button class="btn-fn" onclick="insert('ln(')">ln</button>

    <button class="btn-fn" onclick="insert('√(')">√</button>
    <button class="btn-fn" onclick="insert('^')">xʸ</button>
    <button class="btn-fn" onclick="insert('²')">x²</button>
    <button class="btn-fn" onclick="insert('π')">π</button>

    <!-- Mengganti tombol 'e' menjadi '%' agar tetap presisi 5 kolom x 7 baris -->
    <button class="btn-fn" onclick="insert('%')">%</button>

    <button class="btn-num" onclick="insert('7')">7</button>
    <button class="btn-num" onclick="insert('8')">8</button>
    <button class="btn-num" onclick="insert('9')">9</button>
    <button class="btn-op" onclick="insert('÷')">÷</button>
    <button class="btn-fn" onclick="insert('!')">x!</button>

    <button class="btn-num" onclick="insert('4')">4</button>
    <button class="btn-num" onclick="insert('5')">5</button>
    <button class="btn-num" onclick="insert('6')">6</button>
    <button class="btn-op" onclick="insert('×')">×</button>
    <button class="btn-fn" onclick="insert('a/b')">a/b</button>

    <button class="btn-num" onclick="insert('1')">1</button>
    <button class="btn-num" onclick="insert('2')">2</button>
    <button class="btn-num" onclick="insert('3')">3</button>
    <button class="btn-op" onclick="insert('-')">-</button>
    <button class="cat-btn" onclick="calculate()" title="Hitung ="></button>

    <button class="btn-num" onclick="insert('0')">0</button>
    <button class="btn-num" onclick="insert('.')">.</button>
    <button class="btn-fn" onclick="insert('ANS')">ANS</button>
    <button class="btn-op" onclick="insert('+')">+</button>
  </div>
  <div class="small">Pecahan pakai a/b contoh 3/4 = 0.75 • Pangkat pakai ^ • √() untuk akar </div>
</div>

<script>
let expr = ''; let isDeg = true; let lastAns = 0;
const exprEl = document.getElementById('expr');
const resEl = document.getElementById('result');
const modeEl = document.getElementById('mode');

function update(){ exprEl.textContent = expr || '0'; }

function toggleAngle(){
  isDeg = !isDeg;
  modeEl.textContent = `Mode: ${isDeg ? 'DEG' : 'RAD'} | Tap CAT untuk =`;
  document.querySelector('.header span').textContent = isDeg ? 'DEG • SCI' : 'RAD • SCI';
  const degBtn = document.querySelector('.grid button');
  if(degBtn) degBtn.textContent = isDeg ? 'DEG' : 'RAD';
}

function insert(v){
  if(v === 'a/b') v = '/';
  if(expr === '0' && /[0-9πe.]/.test(v)) expr = '';
  expr += v;
  update();
}

function clearAll(){
  expr = '';
  resEl.textContent = '0';
  modeEl.textContent = `Mode: ${isDeg ? 'DEG' : 'RAD'} | Tap CAT untuk =`;
  update();
}

function del(){
  expr = expr.slice(0, -1);
  update();
}

// Fungsi faktorial aman
function factorial(n){
  if(n < 0) return NaN;
  if(Math.abs(n - Math.round(n)) > 1e-9) return NaN; // Hanya integer
  n = Math.round(n);
  if(n === 0 || n === 1) return 1;
  let r = 1;
  for(let i = 2; i <= n; i++) r *= i;
  return r;
}

// Wrapper Trigonometri
function calcSin(x){ return isDeg ? Math.sin(x * Math.PI / 180) : Math.sin(x); }
function calcCos(x){ return isDeg ? Math.cos(x * Math.PI / 180) : Math.cos(x); }
function calcTan(x){ return isDeg ? Math.tan(x * Math.PI / 180) : Math.tan(x); }

function parseExpression(input) {
  let e = input;
  
  // 1. Ganti operator dasar & konstanta
  e = e.replace(/×/g, '*').replace(/÷/g, '/');
  e = e.replace(/π/g, 'Math.PI').replace(/\be\b/g, 'Math.E');
  e = e.replace(/ANS/g, `(${lastAns})`);
  e = e.replace(/²/g, '**2');
  e = e.replace(/\^/g, '**');

  // 2. Perkalian Implisit (misal: 2π -> 2*Math.PI, 3(4) -> 3*(4), 5sin -> 5*sin)
  e = e.replace(/(\d)(\()\vert{}(\))(\d)|(\d)(Math\.PI|Math\.E|calcSin|calcCos|calcTan|Math\.log10|Math\.log|Math\.sqrt)/g, '$1$3*$2$4');

  // 3. Ganti fungsi matematika
  e = e.replace(/sin\(/g, 'calcSin(');
  e = e.replace(/cos\(/g, 'calcCos(');
  e = e.replace(/tan\(/g, 'calcTan(');
  e = e.replace(/log\(/g, 'Math.log10(');
  e = e.replace(/ln\(/g, 'Math.log(');
  e = e.replace(/√\(/g, 'Math.sqrt(');

  // 4. Operasi Persen (%)
  // Menangani kasus persen gabungan seperti '100+10%' menjadi '100+(100*10/100)'
  e = e.replace(/(\d+(?:\.\d+)?)\s*([+\-])\s*(\d+(?:\.\d+)?)%/g, '$1 $2 ($1 * ($3 / 100))');
  // Menangani persen tunggal seperti '50%' -> '(50/100)'
  e = e.replace(/([0-9.a-zA-Z]+|\([^)]+\))%/g, '($1/100)');

  // 5. Faktorial (!) -> membalut operand di kirinya
  let prevE;
  do {
    prevE = e;
    e = e.replace(/([0-9.a-zA-Z]+|\([^)]+\))!/g, 'factorial($1)');
  } while (e !== prevE);

  return e;
}

function calculate(){
  if(!expr.trim()) return;
  try{
    let parsedExpr = parseExpression(expr);
    
    // Evaluasi fungsi matematis dengan konteks aman
    let val = new Function('factorial', 'calcSin', 'calcCos', 'calcTan', 'Math', `return ${parsedExpr}`)(
      factorial, calcSin, calcCos, calcTan, Math
    );

    if (val === undefined || isNaN(val) || !isFinite(val)) {
      resEl.textContent = 'Error';
      return;
    }

    // Pembulatan presisi floating point
    val = Math.round((val + Number.EPSILON) * 1e12) / 1e12;
    
    resEl.textContent = val.toLocaleString('id-ID');
    lastAns = val;

    // Tampilkan pecahan sederhana jika angka desimal
    if(Math.abs(val) < 1000 && val % 1 !== 0){
      let frac = toFraction(val);
      if(frac) modeEl.textContent = `≈ ${frac} | Mode: ${isDeg ? 'DEG' : 'RAD'}`;
      else modeEl.textContent = `Mode: ${isDeg ? 'DEG' : 'RAD'} | Tap CAT untuk =`;
    } else {
      modeEl.textContent = `Mode: ${isDeg ? 'DEG' : 'RAD'} | Tap CAT untuk =`;
    }
  }catch(err){
    resEl.textContent = 'Error';
  }
}

function toFraction(x){
  let tol = 1e-6; 
  let h1=1, h2=0, k1=0, k2=1; 
  let b = x;
  do{ 
    let a = Math.floor(b); 
    let aux = h1; h1 = a * h1 + k1; k1 = aux; 
    aux = k2; k2 = a * k2 + h2; h2 = aux; 
    b = 1 / (b - a); 
  } while(Math.abs(x - h1 / k2) > Math.abs(x) * tol && k2 < 1000);
  
  if(k2 > 1 && k2 < 100) return h1 + '/' + k2; 
  return null;
}

// Support Keyboard Shortcut
document.addEventListener('keydown', e => { 
  if(/[0-9+\-*/().^!%]/.test(e.key)){ 
    insert(e.key); 
  } else if(e.key === 'Enter'){ 
    e.preventDefault();
    calculate(); 
  } else if(e.key === 'Backspace'){ 
    del(); 
  } else if(e.key === 'Escape'){
    clearAll();
  }
});

update();
</script>
